# API Contract: Multi-User Web TODO Application

**Feature**: 001-todo-app-auth
**Date**: 2026-01-07
**Version**: 1.0.0

## Overview

This document defines the API contracts for the multi-user web-based TODO application. All endpoints require JWT authentication unless explicitly stated otherwise.

## Base Configuration

- **Base URL**: `/api/v1`
- **Authentication**: JWT token required in `Authorization: Bearer <token>` header for protected endpoints
- **Content-Type**: `application/json`
- **Response Format**: JSON

## Global Error Responses

### 401 Unauthorized
For requests without valid authentication:
```json
{
  "error": "Unauthorized",
  "message": "Invalid or expired authentication token"
}
```

### 403 Forbidden
For requests attempting to access resources belonging to another user:
```json
{
  "error": "Forbidden",
  "message": "Access denied: Insufficient permissions"
}
```

### 404 Not Found
For requests attempting to access non-existent resources:
```json
{
  "error": "Not Found",
  "message": "Requested resource does not exist"
}
```

## Endpoints

### Authentication Endpoints

#### POST /api/v1/auth/register
Register a new user account (no authentication required)

**Request Body**:
```json
{
  "email": "user@example.com",
  "password": "SecurePass123!"
}
```

**Validation**:
- Email: Required, valid email format
- Password: Required, minimum 8 characters with uppercase, lowercase, number, and special character

**Success Response** (201 Created):
```json
{
  "success": true,
  "message": "Account created successfully",
  "user": {
    "id": "user-uuid",
    "email": "user@example.com"
  }
}
```

#### POST /api/v1/auth/login
Authenticate user and return JWT token (no authentication required)

**Request Body**:
```json
{
  "email": "user@example.com",
  "password": "SecurePass123!"
}
```

**Success Response** (200 OK):
```json
{
  "success": true,
  "user": {
    "id": "user-uuid",
    "email": "user@example.com"
  },
  "token": "jwt-token-string"
}
```

#### POST /api/v1/auth/logout
Invalidate current session (authentication required)

**Success Response** (200 OK):
```json
{
  "success": true,
  "message": "Logged out successfully"
}
```

### Task Management Endpoints

#### GET /api/v1/tasks
Retrieve all tasks for the authenticated user

**Headers**:
- Authorization: Bearer `<token>`

**Success Response** (200 OK):
```json
{
  "tasks": [
    {
      "id": 1,
      "user_id": "user-uuid",
      "title": "Sample task title",
      "description": "Optional description of the task",
      "is_completed": false,
      "created_at": "2026-01-07T10:00:00Z",
      "updated_at": "2026-01-07T10:00:00Z"
    }
  ]
}
```

#### POST /api/v1/tasks
Create a new task for the authenticated user

**Headers**:
- Authorization: Bearer `<token>`

**Request Body**:
```json
{
  "title": "New task title",
  "description": "Optional description",
  "is_completed": false
}
```

**Validation**:
- Title: Required, maximum 100 characters
- Description: Optional, maximum 1000 characters
- is_completed: Optional, defaults to false

**Success Response** (201 Created):
```json
{
  "id": 1,
  "user_id": "user-uuid",
  "title": "New task title",
  "description": "Optional description",
  "is_completed": false,
  "created_at": "2026-01-07T10:00:00Z",
  "updated_at": "2026-01-07T10:00:00Z"
}
```

#### GET /api/v1/tasks/{id}
Retrieve a specific task if it belongs to the authenticated user

**Path Parameters**:
- id: Task ID (integer)

**Headers**:
- Authorization: Bearer `<token>`

**Success Response** (200 OK):
```json
{
  "id": 1,
  "user_id": "user-uuid",
  "title": "Sample task title",
  "description": "Optional description",
  "is_completed": false,
  "created_at": "2026-01-07T10:00:00Z",
  "updated_at": "2026-01-07T10:00:00Z"
}
```

#### PUT /api/v1/tasks/{id}
Update task content for the authenticated user

**Path Parameters**:
- id: Task ID (integer)

**Headers**:
- Authorization: Bearer `<token>`

**Request Body**:
```json
{
  "title": "Updated task title",
  "description": "Updated description",
  "is_completed": true
}
```

**Success Response** (200 OK):
```json
{
  "id": 1,
  "user_id": "user-uuid",
  "title": "Updated task title",
  "description": "Updated description",
  "is_completed": true,
  "created_at": "2026-01-07T10:00:00Z",
  "updated_at": "2026-01-07T11:00:00Z"
}
```

#### DELETE /api/v1/tasks/{id}
Delete a task if it belongs to the authenticated user

**Path Parameters**:
- id: Task ID (integer)

**Headers**:
- Authorization: Bearer `<token>`

**Success Response** (200 OK):
```json
{
  "success": true,
  "message": "Task deleted successfully"
}
```

#### PATCH /api/v1/tasks/{id}/toggle
Toggle the completion status of a task

**Path Parameters**:
- id: Task ID (integer)

**Headers**:
- Authorization: Bearer `<token>`

**Success Response** (200 OK):
```json
{
  "id": 1,
  "user_id": "user-uuid",
  "title": "Sample task title",
  "description": "Optional description",
  "is_completed": true,
  "created_at": "2026-01-07T10:00:00Z",
  "updated_at": "2026-01-07T11:00:00Z"
}
```

## Security Requirements

1. **JWT Validation**: All protected endpoints must validate JWT tokens using BETTER_AUTH_SECRET
2. **User ID Matching**: The user_id in the JWT must match the resource owner
3. **Data Isolation**: Users cannot access tasks belonging to other users
4. **Input Validation**: All inputs must be validated according to specified constraints
5. **Rate Limiting**: API endpoints should implement rate limiting to prevent abuse